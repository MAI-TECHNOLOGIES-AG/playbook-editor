# ============================================================================
# Playbook — source of truth for Diligence Topics and Checks
# ============================================================================
#
# Hierarchy:  Diligence Topic  >  Check (playbook blueprint)  >  Result (runtime)
#
# A Playbook defines DiligenceTopics: cohesive groupings of Checks that a
# lawyer applies to a deal. A DiligenceTopic can span multiple dimensions
# (HR, CORPORATE_GOVERNANCE, IP, etc.) — it's a "playbook construct" that
# reflects how diligence work actually groups concerns.
#
# A Check is the playbook blueprint — the instruction ("what to look for").
# When a Check is executed against a document, it produces a Result —
# the neutral runtime container that evaluates to either `finding` (anomaly
# detected) or `cleared` (check passed).
# ============================================================================

version: "0.2"

# ----------------------------------------------------------------------------
# Diligence Topics
# ----------------------------------------------------------------------------
# Each topic represents a coherent investigation area. Lawyers select topics
# to apply to a deal; each topic drags in its checks.
#
# Fields:
#   id           — stable identifier (kebab-case)
#   name         — display name
#   description  — what this topic covers and why these checks are grouped
#   dimensions   — list of legal-dd Dimension enums this topic touches
#                  (informational; a single topic can span multiple)
#   checks       — list of check ids owned by this topic
#                  (references entries in the `checks:` section below)
# ----------------------------------------------------------------------------

diligence_topics:
  - id: shareholder-participation-rights
    name: Shareholder Participation Rights
    description: |
      Evaluates whether the company protected shareholder rights during ordinary
      meetings. Verifies meeting frequency, statutory deadlines, representation,
      notice periods, agenda completeness, and board approvals to ensure valid
      corporate governance and prevent voidable resolutions.
    dimensions:
      - CORPORATE_GOVERNANCE
    checks:
      - ch-annual-meeting-existence
      - ch-annual-meeting-timing
      - ch-universal-representation
      - ch-statutory-notice-period
      - ch-invitation-agenda-completeness
      - ch-profit-loss-board-approval

# ----------------------------------------------------------------------------
# Checks (The Playbook Blueprint) - TODO: add the structure
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------

checks:
  - id: cnch-annual-meeting-existee
    label: Annual Meeting Existence (4-Years)
    description: |
      Verifies there is evidence of at least one ordinary shareholders meeting
      conducted per year for the past 4 years.
    severity: high
    dimension: CORPORATE_GOVERNANCE
    basis: statutory
    jurisdictions:
      - CH
    recommendation: |
      Flag missing years for structural corporate defect. Assess risk of
      organizational deficiency claims.
    evaluation_rule:
      clear_condition: >
        Exactly 4 distinct ordinary AGM protocols are found, one for each of the last 4 financial years.
      finding_condition: >
        Any of the last 4 financial years is missing an ordinary AGM protocol.
    execution:
      scope: global
      context_exports:
        - agm_document_ids
      steps:
        - step_1: "Determine the required 4-year range based on the current year."
        - step_2: "Execute lexical_search for 'Generalversammlung' or 'AGM' filtered by the required years."
        - step_3: "Evaluate the search results against the evaluation_rule."
        - step_4: "Call register_result(status). If clear, attach the 4 doc_ids. If finding, specify missing years. Export found doc_ids to agm_document_ids."

  - id: ch-annual-meeting-timing
    label: Annual Meeting Timing
    description: |
      The annual shareholder meeting must be conducted strictly after the financial
      year-end and within 6 months of that date.
    severity: high
    dimension: CORPORATE_GOVERNANCE
    basis: statutory
    jurisdictions:
      - CH
    recommendation: |
      Draft board resolution to ratify the late meeting. Confirm no shareholder
      challenges have been filed regarding the delay.
    evaluation_rule:
      clear_condition: >
        The AGM execution date is <= 6 months after the company's financial year-end date.
      finding_condition: >
        The AGM execution date is > 6 months after the company's financial year-end date, or no date can be established.
    execution:
      scope: per_item
      target_list: agm_document_ids
      steps:
        - step_1: "Call get_deal_fact(key='financial_year_end')."
        - step_2: "For the current doc_id, call get_document_facts to extract the meeting execution date."
        - step_3: "Calculate the exact calendar difference between the two dates."
        - step_4: "Evaluate against the evaluation_rule and call register_result(target_id=doc_id)."

  - id: ch-universal-representation
    label: Universal Shareholder Representation
    description: |
      Evaluates if all shareholders were present or validly represented at the
      meeting (Universalversammlung). A 'finding' here indicates not all
      shareholders were represented, which triggers formal notice requirements.
    severity: low
    dimension: CORPORATE_GOVERNANCE
    basis: statutory
    jurisdictions:
      - CH
    recommendation: |
      Proceed to formal notice and invitation verification.
    evaluation_rule:
      clear_condition: >
        The protocol explicitly states 100% of share capital is represented, or explicitly uses the term 'Universalversammlung'.
      finding_condition: >
        Less than 100% of share capital is represented, or attendance metrics are missing.
    execution:
      scope: per_item
      target_list: agm_document_ids
      context_exports:
        - non_universal_agm_docs
      steps:
        - step_1: "For the current doc_id, call get_document_structure to locate the Attendance/Representation clause."
        - step_2: "Call read_content_node using the identified node_id."
        - step_3: "Evaluate the extracted text against the evaluation_rule."
        - step_4: "Call register_result(target_id=doc_id). If status is 'finding', export this doc_id to non_universal_agm_docs."

  - id: ch-statutory-notice-period
    label: Statutory Notice Period
    description: |
      Ensures an invitation to the shareholders' meeting was sent to all
      unrepresented shareholders at least 20 days before the meeting.
    severity: medium
    dimension: CORPORATE_GOVERNANCE
    basis: statutory
    jurisdictions:
      - CH
    prerequisites:
      - check_id: ch-universal-representation
        required_state: finding
    recommendation: |
      Resolutions may be voidable. Assess shareholder challenge risk and
      evaluate cure mechanisms.
    evaluation_rule:
      clear_condition: >
        The dispatch date of the meeting invitation is >= the required notice period (20 days, or custom statuten period) prior to the meeting date.
      finding_condition: >
        The dispatch date is < the required notice period, or no invitation evidence exists.
    execution:
      scope: per_item
      target_list: non_universal_agm_docs
      steps:
        - step_1: "Call get_deal_fact(key='custom_agm_notice_period'). If null, default to 20 days."
        - step_2: "Call get_document_facts for the current doc_id to get the meeting date."
        - step_3: "Execute lexical_search for 'Einladung' (Invitation) linked to this meeting date."
        - step_4: "Calculate the calendar days between the invitation dispatch date and the meeting date."
        - step_5: "Evaluate against the evaluation_rule and call register_result(target_id=doc_id)."

  - id: ch-invitation-agenda-completeness
    label: Invitation Agenda Completeness
    description: |
      Verifies that the dispatched meeting invitation contains a formal agenda
      outlining the items to be voted upon.
    severity: medium
    dimension: CORPORATE_GOVERNANCE
    basis: statutory
    jurisdictions:
      - CH
    prerequisites:
      - check_id: ch-universal-representation
        required_state: finding
    recommendation: |
      Unannounced agenda items cannot be validly resolved. Identify all
      resolutions passed without prior agenda notice for ratification.
    evaluation_rule:
      clear_condition: >
        The meeting invitation includes a specific list of agenda items to be voted upon.
      finding_condition: >
        The invitation lacks an agenda, or no invitation document can be found.
    execution:
      scope: per_item
      target_list: non_universal_agm_docs
      steps:
        - step_1: "Execute lexical_search for the invitation corresponding to the current AGM doc_id."
        - step_2: "If found, call read_document_pages or read_content_node to extract the invitation text."
        - step_3: "Evaluate the text against the evaluation_rule."
        - step_4: "Call register_result(target_id=doc_id)."

  - id: ch-profit-loss-board-approval
    label: Board Approval of Profit and Loss
    description: |
      Confirms the profit and losses were formally approved and proposed by
      the board prior to the shareholder meeting.
    severity: low
    dimension: CORPORATE_GOVERNANCE
    basis: statutory
    jurisdictions:
      - CH
    recommendation: |
      Require immediate shareholder ratification of any dividend distributions.
      Flag potential director liability for unauthorized distributions.
    evaluation_rule:
      clear_condition: >
        Evidence exists (either in the AGM protocol or a prior Board Resolution) that the Board of Directors formally approved the financial statements and proposed the appropriation of profit/loss before the AGM vote.
      finding_condition: >
        No evidence of prior board approval is found.
    execution:
      scope: per_item
      target_list: agm_document_ids
      steps:
        - step_1: "For the current doc_id, call get_document_structure to locate the 'Appropriation of Profit' or 'Financial Statements' clause."
        - step_2: "Call read_content_node to evaluate if the text explicitly references a prior board proposal."
        - step_3: "If insufficient evidence, execute lexical_search for Board Resolutions matching the relevant financial year."
        - step_4: "Evaluate all gathered evidence against the evaluation_rule."
        - step_5: "Call register_result(target_id=doc_id)."
